name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86, x86_64]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Build static library
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            APP_ABI=${{ matrix.abi }} \
            APP_PLATFORM=android-21 \
            BUILD_TYPE=static

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find obj/local -name 'libmemscan.a' -exec cp {} dist/libmemscan-${{ matrix.abi }}.a \;
          ls -la dist

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/libmemscan-${{ matrix.abi }}.a